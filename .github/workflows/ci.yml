name: Build and Update GitOps

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}

      - name: Update Config Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone the config repo using the PAT
          git clone https://${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/k8s-gitops-config.git
          cd k8s-gitops-config

          # Update the image line in deployment.yaml
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.vars.outputs.sha_short }}|g" deployment.yaml

          # Commit and push back to config repo
          git add deployment.yaml
          git commit -m "Auto-update image to ${{ steps.vars.outputs.sha_short }} [skip ci]" || echo "No changes"
          git push origin main
